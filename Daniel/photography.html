  <script>
    function isScrolledIntoView(el) {
      let elemTop = el.getBoundingClientRect().top;
      let isVisible = elemTop >= 0 && elemTop <= (window.innerHeight / 2);
      return isVisible;
    }


    function pauseAndPlayVideosInView() {
      let videos = document.querySelectorAll("video");
      videos.forEach((video, index) => {

        video.muted = true;
        video.pause();

        // listen to scroll
        window.addEventListener('scroll', (e) => {
          if (isScrolledIntoView(video) && video.paused) {
            video.play();
          }
        });

        // play if in view on load
        if (isScrolledIntoView(video) && video.paused) {
          video.play();
        }

      });
    }

    pauseAndPlayVideosInView();
  </script>
